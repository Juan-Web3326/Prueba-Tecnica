spring.application.name=Prueba_Tecnica

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:banco}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:@nino-nakano}

# Decirle explícitamente a Hibernate qué base de datos usar
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Reintentos de conexión (espera si MySQL no está listo)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000
