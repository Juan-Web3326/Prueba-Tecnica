version: '3.8'
services:
  # ── Contenedor 1: Base de datos MySQL ──────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: banco_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "@nino-nakano"
      MYSQL_DATABASE: banco
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql   # Los datos persisten aunque se apague el contenedor
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "--password=@nino-nakano" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  # ── Contenedor 2: Tu aplicación Spring Boot ─────────────────────────────────
  app:
    build: .
    container_name: banco_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db             # "db" es el nombre del contenedor MySQL de arriba
      DB_PORT: 3306           # Puerto interno de MySQL dentro de Docker
      DB_NAME: banco
      DB_USER: root
      DB_PASSWORD: "@nino-nakano"
    depends_on:
      db:
        condition: service_healthy   # Espera a que MySQL esté listo antes de arrancar

# Volumen nombrado para persistir los datos de MySQL
volumes:
  mysql_data: